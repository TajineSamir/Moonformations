<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message envoyé — Moon Formations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <meta http-equiv="refresh" content="8;url=index.html">
</head>
<body>

  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <img src="logo.png" alt="Moon Formations" class="nav-logo-img">
      </a>
    </div>
  </nav>

  <section style="min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem;">
    <div style="max-width:560px;">
      <div style="font-size:4rem; color:var(--terracotta); margin-bottom:2rem;">✦</div>
      <h1 style="font-size:3rem; margin-bottom:1.5rem;">Merci pour<br><em>votre message</em></h1>
      <p style="font-size:1.1rem; color:var(--gris); margin-bottom:0.75rem;">Votre demande a bien été envoyée à notre équipe.</p>
      <p style="color:var(--gris);">Nous vous recontactons sous <strong style="color:var(--noir);">24h ouvrées</strong> avec une proposition adaptée à votre projet.</p>
      <div style="margin-top:3rem; padding:1.5rem; background:var(--beige); border-radius:4px;">
        <p style="font-size:0.875rem; color:var(--gris);">Vous serez redirigé automatiquement vers l'accueil dans quelques secondes.</p>
      </div>
      <div style="margin-top:2rem;">
        <a href="index.html" class="btn btn-primary">Retour à l'accueil</a>
        <a href="catalogue.html" class="btn btn-secondary" style="margin-left:1rem;">Voir le catalogue</a>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
